# Временный конфиг до выпуска сертификата: сайт по HTTP и проверка домена для Let's Encrypt.
# После выпуска сертификата bootstrap заменяет его на cyberzavod.conf.

server {
    listen 80;
    listen [::]:80;
    server_name cyberzavod.com www.cyberzavod.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include snippets/cyberzavod-routes.conf;
}

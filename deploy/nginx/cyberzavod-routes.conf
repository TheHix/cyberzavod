# Маршрутизация в контейнеры. Подключается в server-блок через include,
# одинаково для временного HTTP-конфига и для основного HTTPS.

# В nginx.conf Ubuntu стоит server_tokens build — версию nginx наружу не показываем.
server_tokens off;
client_max_body_size 1m;

location /api/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    proxy_pass http://127.0.0.1:8082;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
}

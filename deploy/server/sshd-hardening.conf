# Вход только по ключу и не под root. Префикс 00 в имени файла на сервере нужен, чтобы он
# читался раньше 50-cloud-init.conf: в sshd побеждает первое найденное значение, а
# cloud-init на этом образе включает вход по паролю.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes

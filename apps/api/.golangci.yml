# Go linter: run from `make check-api` and in CI.
version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - revive
    - errorlint
    - bodyclose
    - noctx
    - nilerr
    - copyloopvar
  # revive with the default rule set: it includes exported (a comment on
  # an exported identifier, starting with its name) and package-comments.

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/bysavelii/cyberzavod

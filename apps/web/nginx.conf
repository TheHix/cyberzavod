# nginx inside the site container: only serves the Astro static files.

# The "not found" page in the address language: under /ru/ Russian, otherwise English (the
# default language).
map $uri $not_found_page {
    ~^/ru/ /ru/404/index.html;
    default /404.html;
}

server {
    listen 8080;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    error_page 404 $not_found_page;

    # Build files with a hash in the name never change: cached forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML is always revalidated so a new deploy is visible at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html $uri.html =404;
    }
}

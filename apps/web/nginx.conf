# nginx внутри контейнера сайта: только раздача статики Astro.

# Страница «не найдено» на языке адреса: под /ru/ — русская, иначе — английская (язык по умолчанию).
map $uri $not_found_page {
    ~^/ru/ /ru/404/index.html;
    default /404.html;
}

server {
    listen 8080;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    error_page 404 $not_found_page;

    # Файлы сборки с хешем в имени не меняются — кешируются навсегда.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML всегда перепроверяется, чтобы новый деплой был виден сразу.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html $uri.html =404;
    }
}

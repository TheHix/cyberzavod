# Dev-контейнер и база рядом с ним. Docker внутри контейнера нет намеренно:
# Docker-in-Docker требует привилегированного режима, а это свело бы изоляцию на нет.
name: cyberzavod-dev

services:
  dev:
    build:
      context: .
      args:
        TZ: ${TZ:-Europe/Moscow}
    command: sleep infinity
    # Нужны только для iptables внутри контейнера.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      DATABASE_URL: postgres://cyberzavod:cyberzavod@db:5432/cyberzavod?sslmode=disable
      API_ADDR: ":8080"
      # client_id OAuth-приложения GitHub для входа из CLI; пусто — вход недоступен.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      CLAUDE_CONFIG_DIR: /home/node/.claude
      # Без телеметрии: меньше доменов в белом списке файрвола.
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      ASTRO_TELEMETRY_DISABLED: "1"
      HISTFILE: /commandhistory/.zsh_history
      # Хранилище pnpm — в своём томе. Иначе pnpm, видя node_modules на другом томе,
      # создаёт .pnpm-store прямо в папке проекта на хосте.
      npm_config_store_dir: /home/node/.local/share/pnpm/store
      # pnpm из packageManager скачивается без интерактивного вопроса.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    ports:
      - "127.0.0.1:4321:4321"
      - "127.0.0.1:8080:8080"
    volumes:
      - ..:/workspace:cached
      # Конфиг и хуки git — только на чтение: иначе агент мог бы записать туда команду
      # (core.fsmonitor, хук), и её выполнил бы git status на хосте.
      - ../.git/config:/workspace/.git/config:ro
      - ../.git/hooks:/workspace/.git/hooks:ro
      # Свои node_modules у контейнера: на Mac и в Linux разные бинарники (esbuild).
      - node-modules:/workspace/node_modules
      - web-node-modules:/workspace/apps/web/node_modules
      - core-node-modules:/workspace/packages/core/node_modules
      - storage-node-modules:/workspace/packages/storage/node_modules
      - cli-node-modules:/workspace/packages/cli/node_modules
      - adapter-claude-node-modules:/workspace/adapters/claude/node_modules
      - pnpm-store:/home/node/.local/share/pnpm
      - go-cache:/home/node/go
      # Вход в Claude и GitHub сохраняется между пересборками контейнера.
      - claude-config:/home/node/.claude
      - gh-config:/home/node/.config/gh
      - history:/commandhistory
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: cyberzavod
      POSTGRES_USER: cyberzavod
      POSTGRES_PASSWORD: cyberzavod
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberzavod -d cyberzavod"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  node-modules:
  web-node-modules:
  core-node-modules:
  storage-node-modules:
  cli-node-modules:
  adapter-claude-node-modules:
  pnpm-store:
  go-cache:
  claude-config:
  gh-config:
  history:
  db-data:

# Release of the npm package `cyberzavod` on a vX.Y.Z tag: the same checks as in CI, then publishing
# the built CLI. The tag must match the package version, otherwise the release stops.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing: npm accepts publishing with the job's OIDC token instead of a secret
      # and signs the package provenance itself.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Тег совпадает с версией пакета
        run: |
          version=$(node -p 'require("./packages/cli/package.json").version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "тег $GITHUB_REF_NAME, а версия пакета $version" >&2
            exit 1
          fi
      - run: make check-web
      # The same human path on the archive that will go to npm, before publishing.
      - run: pnpm smoke
      # The monorepo packages are already bundled into dist/cyberzavod.mjs and have no versions:
      # they cannot be substituted for workspace:*.
      # The package user needs no devDependencies, so they are removed from the published manifest.
      - name: Манифест пакета без зависимостей сборки
        working-directory: packages/cli
        run: npm pkg delete devDependencies
      - name: Публикация
        working-directory: packages/cli
        run: npm publish --access public
      # The registry serves the new version with a delay of up to several minutes (0.9.1 took more
      # than two): wait until latest becomes the tag version, at most 10 minutes.
      - name: Версия видна в npm как latest
        run: |
          version=$(node -p 'require("./packages/cli/package.json").version')
          for attempt in $(seq 40); do
            latest=$(npm view cyberzavod dist-tags.latest)
            if [[ "$latest" == "$version" ]]; then exit 0; fi
            sleep 15
          done
          echo "npm отдаёт latest $latest, а выпущена $version" >&2
          exit 1
